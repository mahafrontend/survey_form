<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Survey Form</title>
  </head>

  <body>
    <h1 id="title">Student Feedback Survey</h1>

    <p id="description">
    Please fill out this survey to help us improve our courses.
    </p>

    <form id="survey-form">

    <label id="name-label" for="name">Name</label><br>
    <input
      type="text"
      id="name"
      name="name"
      placeholder="Enter your full name"
      required
    ><br><br>

    <label id="email-label" for="email">Email</label><br>
    <input
      type="email"
      id="email"
      name="email"
      placeholder="Enter your email"
      required
    ><br><br>

    <label id="number-label" for="number">Age</label><br>
    <input
      type="number"
      id="number"
      name="age"
      min="10"
      max="100"
      placeholder="Enter your age"
    ><br><br>

    <label for="dropdown">Favorite Subject</label><br>
    <select id="dropdown" name="subject">
      <option value="html">HTML</option>
      <option value="css">CSS</option>
      <option value="javascript">JavaScript</option>
    </select>

    <br><br>

    <p>How do you study?</p>

    <input
      type="radio"
      id="online"
      name="study"
      value="online"
    >
    <label for="online">Online</label><br>

    <input
      type="radio"
      id="offline"
      name="study"
      value="offline"
    >
    <label for="offline">Offline</label>

    <br><br>

    <p>Which topics do you enjoy?</p>

    <input
      type="checkbox"
      id="html"
      value="html"
    >
    <label for="html">HTML</label><br>

    <input
      type="checkbox"
      id="css"
      value="css"
    >
    <label for="css">CSS</label><br>

    <input
      type="checkbox"
      id="js"
      value="javascript"
    >
    <label for="js">JavaScript</label>

    <br><br>

    <label for="comments">Additional Comments</label><br>
    <textarea
      id="comments"
      rows="5"
      cols="40"
      placeholder="Write your comments here..."
    ></textarea>

    <br><br>

    <button id="submit" type="submit">
      Submit
    </button>

  </form>
  </body>
</html>
